<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
  <title>ラフカ語辞書</title>
  <style>:root {
  --ink: #1c2530;
  --paper: #f4f6f8;
  --card: #ffffff;
  --line: #d8dee5;
  --accent: #274c8f;
  --accent-bg: #e7eefb;
  --meta: #66717e;
  --pos: #0f6b5c;
  --pos-bg: #e2f3ef;
  --class: #4a4f9b;
  --class-bg: #e9eafa;
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.7;
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 24px 20px 64px;
}
header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
header h1 {
  font-size: 21px;
  margin: 0;
  letter-spacing: 0.02em;
}
.stat {
  font-size: 12px;
  color: var(--meta);
}
a {
  color: var(--accent);
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
button,
select {
  color: var(--ink);
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.searchbar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--paper);
  padding: 6px 0 12px;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
}
#query {
  width: 100%;
  min-width: 0;
  color: var(--ink);
  background: var(--card);
  font-size: 17px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-family: 'SF Mono', Consolas, 'Noto Sans Mono', monospace;
}
#query:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
.opts {
  display: flex;
  gap: 10px 18px;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 13px;
  color: #3d4652;
}
.opts label {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.opts fieldset {
  border: none;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.opts legend {
  float: left;
  padding: 0 6px 0 0;
  color: var(--meta);
  font-size: 12px;
}
.opts input {
  margin: 0;
  accent-color: var(--accent);
}
.opts select {
  max-width: 190px;
  font-size: 13px;
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
}
#reset,
#clear-tag {
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  padding: 2px 10px;
}
#reset {
  margin-left: auto;
}
.result-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--meta);
  margin: 0 2px 8px;
}
#count {
  font-size: 13px;
  margin: 0;
}
#shuffle {
  padding: 3px 12px;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--card);
}
#shuffle:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}
#shuffle:disabled {
  opacity: 0.35;
  cursor: default;
}
.entry {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}
.entry-head {
  display: flex;
  gap: 12px;
  align-items: baseline;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.entry h2 {
  margin: 0;
  font-size: 18px;
  font-family: 'SF Mono', Consolas, monospace;
  color: var(--accent);
}
.conjbtn {
  font-size: 11.5px;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid #cddcf5;
  border-radius: 99px;
  padding: 1px 10px;
}
.conjbtn:hover {
  background: #d8e5fa;
}
.conjbtn[aria-expanded='true'] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 5px;
  margin: 0 0 4px;
}
.tag {
  border: none;
  border-radius: 5px;
  padding: 0 5px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--class);
  background: var(--class-bg);
}
.tag.pos {
  color: var(--pos);
  background: var(--pos-bg);
}
.tag:hover {
  text-decoration: underline;
}
.meaning {
  margin: 0;
  white-space: pre-wrap;
}
.meaning.senses {
  padding-left: 1.8em;
}
.meaning.senses li + li {
  margin-top: 2px;
}
.etym {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--meta);
}
.forms {
  margin: 8px 0 4px;
  padding: 10px 14px;
  background: #f8fafb;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.forms h3 {
  margin: 12px 0 4px;
  font-size: 13px;
  font-weight: 600;
}
.forms h3:first-child {
  margin-top: 0;
}
.table-wrap {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  font-size: 14px;
  width: 100%;
}
th {
  text-align: left;
  font-weight: 400;
  color: var(--meta);
  padding: 2px 14px 2px 0;
  white-space: nowrap;
  vertical-align: top;
  font-size: 12px;
}
thead th {
  border-bottom: 1px solid var(--line);
}
td {
  padding: 3px 14px 3px 0;
  vertical-align: top;
}
td:last-child {
  padding-right: 0;
}
.cell-value {
  font-family: 'SF Mono', Consolas, monospace;
}
.relations {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 8px;
  font-size: 12px;
  color: var(--meta);
  margin-top: 4px;
}
.relation {
  border: none;
  padding: 0;
  background: none;
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 13px;
  color: var(--accent);
  text-decoration: underline;
}
.empty {
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  font-size: 13px;
}
.pager {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin: 18px 0;
  font-size: 13px;
}
#pager-top {
  margin: 4px 0 10px;
}
.pager button {
  min-width: 34px;
  height: 36px;
  padding: 0 8px;
  font-size: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
}
.pager button:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}
.pager button:disabled {
  opacity: 0.35;
  cursor: default;
}
.pager button[aria-current='page'],
.pager button[aria-current='page']:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.pager .gap {
  color: var(--meta);
  padding: 0 2px;
}
@media (max-width: 560px) {
  .wrap {
    padding: 16px 12px 40px;
  }
  header {
    gap: 4px 12px;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: 20px;
  }
  .searchbar {
    position: static;
  }
  .panel {
    padding: 12px;
  }
  .opts {
    gap: 8px 12px;
  }
  .opts fieldset {
    gap: 6px 10px;
  }
  .entry {
    padding: 12px 14px;
  }
  .forms {
    padding: 8px 10px;
  }
}
/* Editing controls stay out of the reading view. */
textarea {
  font: inherit;
}
#edit-mode,
.editor-toolbar button,
.entry-edit-controls button,
.editor-dialog button {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  padding: 4px 10px;
  font-size: 13px;
}
#edit-mode {
  font-size: 12px;
  padding: 1px 9px;
}
.editor-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.edit-status {
  font-size: 13px;
  margin: 4px 0;
  width: 100%;
  overflow-wrap: anywhere;
}
.entry-edit-controls {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.entry-edit-controls:empty {
  display: none;
}
.editor-dialog {
  width: min(760px, calc(100% - 24px));
  max-height: calc(100dvh - 32px);
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  background: var(--card);
  overflow: auto;
}
.editor-dialog::backdrop {
  background: #1c253080;
}
.editor-dialog h2 {
  font-size: 19px;
  margin: 0 0 12px;
}
.editor-dialog h3 {
  font-size: 15px;
  margin: 20px 0 8px;
}
.editor-dialog input,
.editor-dialog select,
.editor-dialog textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: white;
  color: var(--ink);
  padding: 6px 8px;
}
.editor-dialog input {
  font-family: 'SF Mono', Consolas, monospace;
}
.editor-dialog label {
  display: block;
  font-size: 13px;
}
.editor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.editor-grid .wide {
  grid-column: 1 / -1;
}
.field-hint {
  grid-column: 1 / -1;
  margin-top: -8px;
  font-size: 12px;
  color: var(--meta);
}
.editor-dialog textarea {
  display: block;
  resize: vertical;
}
.editor-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  position: sticky;
  bottom: -20px;
  padding: 16px 0;
  background: white;
  border-top: 1px solid var(--line);
  margin-top: 20px;
}
.editor-actions .danger {
  color: #a72020;
  margin-left: auto;
}
.editor-dialog button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.editor-dialog button:disabled,
.editor-toolbar button:disabled {
  opacity: 0.45;
  cursor: default;
}
.edit-error {
  color: #a22b2b;
  font-size: 13px;
  margin: 0 0 10px;
}
.edit-error:empty {
  display: none;
}
.edit-table {
  min-width: 0;
  border: 1px solid var(--line);
  padding: 10px;
  margin: 10px 0;
  border-radius: 6px;
}
.edit-table legend {
  font-size: 12px;
  color: var(--meta);
}
.edit-table-heading {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.edit-table-heading button {
  flex-shrink: 0;
}
.form-edit-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto;
  gap: 7px;
  margin-bottom: 7px;
  align-items: start;
}
.form-edit-row input:first-child {
  font-family: inherit;
  font-size: 13px;
}
.change-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.relation-edit-row {
  display: grid;
  grid-template-columns: minmax(90px, 0.7fr) minmax(0, 2fr) auto;
  gap: 7px;
  align-items: start;
  margin-bottom: 12px;
}
.relation-picker {
  min-width: 0;
}
.relation-popup {
  margin-top: 4px;
  border: 1px solid var(--line);
  border-radius: 5px;
  overflow: hidden;
  background: white;
}
.relation-options {
  max-height: 240px;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.editor-dialog .relation-option {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid var(--line);
  padding: 9px 10px;
  text-align: left;
  overflow-wrap: anywhere;
}
.editor-dialog .relation-option:hover,
.editor-dialog .relation-option[aria-selected='true'] {
  background: #eaf0fb;
}
.relation-option-title {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
}
.relation-option-title strong {
  font-size: 15px;
}
.relation-pos,
.relation-meaning,
.relation-status {
  font-size: 12px;
  color: var(--meta);
}
.relation-meaning {
  display: block;
  margin-top: 3px;
  white-space: pre-line;
}
.relation-status {
  margin: 0;
  padding: 7px 10px;
}
#owner-login {
  width: min(460px, calc(100% - 24px));
}
#owner-login p {
  font-size: 13px;
}
#owner-login label {
  margin-top: 16px;
}
#owner-login button {
  margin-right: 8px;
}
#changes-dialog > button {
  margin: 8px 8px 0 0;
}
@media (max-width: 560px) {
  .editor-dialog {
    padding: 14px;
  }
  .editor-grid {
    grid-template-columns: 1fr;
  }
  .editor-actions {
    bottom: -14px;
  }
  .form-edit-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .form-edit-row input:first-child {
    grid-column: 1;
  }
  .form-edit-row input:nth-child(2),
  .form-edit-row select {
    grid-column: 1;
    grid-row: 2;
  }
  .form-edit-row button {
    grid-column: 2;
    grid-row: 1 / 3;
  }
  .relation-edit-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .relation-edit-row > select {
    grid-column: 1;
    grid-row: 1;
  }
  .relation-picker {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .relation-edit-row > button {
    grid-column: 2;
    grid-row: 1;
  }
}

.form-edit-row:has(button:nth-child(4)) {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto auto;
}
@media (max-width: 560px) {
  .form-edit-row:has(button:nth-child(4)) {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .form-edit-row button:nth-child(3) {
    grid-row: 1;
  }
  .form-edit-row button:nth-child(4) {
    grid-row: 2;
  }
}

.sense-tags {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-left: 9px;
  vertical-align: middle;
}
.sense-tags .tag {
  font-size: 11px;
  padding: 1px 5px;
}
.sense-editor {
  border: 1px solid var(--line);
  padding: 10px;
  margin: 0 0 12px;
  min-width: 0;
}
.sense-editor > legend {
  font-size: 13px;
}
.sense-editor details {
  margin-top: 8px;
  font-size: 12px;
}
.sense-editor summary {
  cursor: pointer;
  overflow-wrap: anywhere;
}
.sense-tag-group {
  border: 0;
  padding: 4px 0;
  margin: 8px 0;
}
.sense-tag-group legend {
  color: var(--meta);
}
.editor-dialog .sense-tag-group label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-right: 14px;
}
.editor-dialog .sense-tag-group input {
  width: auto;
}
.sense-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.sense-actions:empty {
  display: none;
}
#add-sense {
  justify-self: start;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ラフカ語辞書</h1>
    <span class="stat" id="stat"></span>
  </header>
  <main>
    <div class="searchbar"><form id="search-form" class="panel" role="search">
      <input id="query" type="search" placeholder="単語・訳語を入力" aria-label="検索語" autocomplete="off" spellcheck="false">
      <div class="opts">
        <fieldset><legend>対象</legend>
          <label><input type="radio" name="scope" value="both" checked>見出し語＋訳語</label>
          <label><input type="radio" name="scope" value="head">見出し語</label>
          <label><input type="radio" name="scope" value="trans">訳語</label>
          <label><input type="radio" name="scope" value="full">全文</label>
        </fieldset>
        <fieldset><legend>方式</legend>
          <label><input type="radio" name="mode" value="prefix">前方一致</label>
          <label><input type="radio" name="mode" value="partial" checked>部分一致</label>
          <label><input type="radio" name="mode" value="exact">完全一致</label>
        </fieldset>
      </div>
      <div class="opts">
        <label><input id="useinfl" type="checkbox" checked>変化形も探す</label>
      </div>
      <div class="opts filters">
        <label>項目 <select id="kind"><option value="">すべて</option><option>単語</option><option>接辞</option><option>接頭辞</option><option>接尾辞</option><option>慣用句</option></select></label>
        <label id="pos-filter">品詞 <select id="pos"><option value="">すべて</option></select></label>
        <label id="numeral-filter">数詞 <select id="numeral"><option value="">指定なし</option><option value="all">すべての数詞</option><option>基数</option><option>序数</option></select></label>
        <label id="gender-filter" hidden>性 <select id="gender" disabled><option value="">すべて</option><option value="M">男性</option><option value="F">女性</option><option value="N">中性</option></select></label>
        <label id="class-filter" hidden>分類 <select id="class" disabled><option value="">すべて</option></select></label>
        <label>タグ <select id="tag-filter"><option value="">指定なし</option></select></label>
        <button type="button" id="reset">リセット</button>
      </div>
    </form></div>
    <div class="result-bar"><p id="count" role="status" aria-live="polite"></p><button id="shuffle" type="button">シャッフル</button><span id="active-tag"></span><button id="clear-tag" hidden>タグ解除</button></div>
    <nav id="pager-top" class="pager" aria-label="検索結果のページ（上）"></nav>
    <div id="results"></div>
    <nav id="pager-bottom" class="pager" aria-label="検索結果のページ（下）"></nav>
  </main>

  const PATTERNS = ['auto', 'consonant', 'a', 'o', 'short', 'glide', 'plural-a', 'plural-i', 'aq'];
  const STRINGS = [
    'nounPattern',
    'obliqueStem',
    'strongStem',
    'presentStem',
    'adjectiveStem',
    'femaleStem',
    'neuterStem',
    'neuterForm',
    'conjugation',
    'pronounPattern',
  ];
  const BOOLEANS = ['impersonal', 'gerundDeclension'];
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const forms = (e) => e.tables.flatMap((t) => t.rows.flatMap((r) => r.cells));
  const map = (e) => Object.fromEntries(forms(e).map((f) => [f.label, f.value]));
  const stem = (s) => (s || '').trim().normalize('NFC').replace(/-$/, '');
  const vowel = (s) => Boolean(s) && V.includes(s.slice(-1));

  function umlaut(s) {
    for (let i = s.length - 1; i >= 0; i--)
      if (V.includes(s[i].toLowerCase()))
        return (
          s.slice(0, i) +
          ({
            a: 'ä',
            o: 'ö',
            u: 'ü',
            A: 'Ä',
            O: 'Ö',
            U: 'Ü',
          }[s[i]] || s[i]) +
          s.slice(i + 1)
        );
    return s;
  }

  function join(s, ending) {
    return (
      s + (vowel(s) && vowel(ending[0]) ? ('ieäüö'.includes(s.slice(-1)) ? 'j' : 'w') : '') + ending
    );
  }

  function bare(s) {
    return s.endsWith('g')
      ? s.slice(0, -1) + ('nrl'.includes(s.slice(-2, -1)) && s.length > 1 ? 'k' : 'q')
      : s.endsWith('c')
        ? s.slice(0, -1) + 'k'
        : s;
  }

  function change(s, a, b) {
    const i = s.lastIndexOf(a);
    if (i < 0) throw Error(a + '/' + b + '交替の語幹を入力してください。');
    return s.slice(0, i) + b + s.slice(i + 1);
  }

  function participle(s) {
    let body;
    if (s.endsWith('bb')) body = s.slice(0, -2) + 'pt';
    else if (s.endsWith('nd')) body = s.slice(0, -2) + 'nt';
    else if (s.endsWith('ld')) body = s.slice(0, -2) + 'lt';
    else if (s.endsWith('d')) body = s.slice(0, -1) + 'tt';
    else if (/[sšžt]$/.test(s)) body = s + 'et';
    else if (/[^aeiouäöürlmnwj][rl]$/.test(s)) body = s.slice(0, -1) + 'e' + s.slice(-1) + 't';
    else
      body =
        s.slice(0, -1) +
        ({
          g: 'ct',
          v: 'ft',
          b: 'pt',
          q: 'ht',
        }[s.slice(-1)] || s.slice(-1) + 't');
    return join('di', body);
  }

  function table(title, columns, labels, values) {
    return {
      title,
      columns,
      rows: labels.map(([label, keys]) => ({
        label,
        cells: keys.map((k) => ({
          label: k,
          value: values[k],
        })),
      })),
    };
  }

  function single(title, keys, values) {
    return table(
      title,
      ['語形'],
      keys.map((k) => [k, [k]]),
      values,
    );
  }

  function nounPattern(e, o) {
    if (o.nounPattern && o.nounPattern !== 'auto') return o.nounPattern;
    if (e.numberRestriction === 'plural' && e.head.endsWith('a')) return 'plural-a';
    if (e.numberRestriction === 'plural' && e.head.endsWith('i')) return 'plural-i';
    if (e.gender === 'F' && e.head.endsWith('a')) return 'a';
    if (e.gender === 'M' && e.head.endsWith('o')) return 'o';
    if (vowel(e.head))
      return (e.gender === 'F' && e.head.endsWith('ü')) || e.head.endsWith('ö') ? 'glide' : 'short';
    return 'consonant';
  }

  function nounStem(e, o, p) {
    if (stem(o.obliqueStem)) return stem(o.obliqueStem);
    if (['Ⅰ型', 'Ⅱ型', '不規則型'].includes(e.class)) throw Error('斜格語幹を入力してください。');
    if (['a', 'o', 'short', 'plural-a', 'plural-i'].includes(p)) return e.head.slice(0, -1);
    if (p === 'aq') return e.head;
    if (e.head.endsWith('q'))
      throw Error('語末 q を保つか g に戻すか、斜格語幹で指定してください。');
    if (e.head.endsWith('k')) return e.head.slice(0, -1) + (/n[k]$/.test(e.head) ? 'g' : 'c');
    return e.head;
  }

  function noun(e, o) {
    const p = nounPattern(e, o),
      s = nounStem(e, o, p),
      values = {},
      numbers =
        e.numberRestriction === 'singular'
          ? ['単数']
          : e.numberRestriction === 'plural'
            ? ['複数']
            : ['単数', '複数'];
    if (!s) throw Error('斜格語幹を入力してください。');
    if (['plural-a', 'plural-i'].includes(p) && e.numberRestriction !== 'plural')
      throw Error('集合名詞の語尾には「複数のみ」を指定してください。');
    for (let i = 0; i < CASES.length; i++) {
      let sg, pl;
      if (p === 'plural-a' || p === 'plural-i') {
        pl =
          i === 0
            ? e.head
            : join(
                s,
                (p === 'plural-a'
                  ? ['a', 'an', 'ar', 'o', 'al']
                  : ['i', 'ins', 'irs', 'us', 'ils'])[i],
              );
      } else if (p === 'short') {
        const v = e.head.slice(-1);
        if (!V.includes(v)) throw Error('短語尾母音幹の見出しは母音で終わります。');
        sg = s + [v, v + 'n', v + 'r', e.gender === 'F' && v === 'ä' ? 'o' : 'u', v + 'l'][i];
        pl = sg + (e.gender === 'N' && i === 0 ? '' : 's');
      } else if (p === 'a' || p === 'o') {
        const ending = (p === 'a' ? ['a', 'an', 'ar', 'o', 'al'] : ['o', 'on', 'or', 'u', 'ol'])[i];
        sg = i === 0 ? e.head : join(s, ending);
        pl = join(s, ending) + 's';
      } else if (p === 'aq') {
        sg = e.head + ['', 'en', 'er', 'u', 'el'][i];
        pl = e.head + ['es', 'ens', 'ers', 'us', 'els'][i];
      } else {
        sg = i === 0 ? e.head : join(i === 2 ? umlaut(s) : s, ['', 'en', 'er', 'u', 'el'][i]);
        const ending = (
          e.gender === 'N' ? ['i', 'ins', 'irs', 'us', 'ils'] : ['es', 'ens', 'ers', 'us', 'els']
        )[i];
        pl = join(e.gender !== 'N' && i === 2 ? umlaut(s) : s, ending);
      }
      values['単数' + CASES[i]] = sg;
      values['複数' + CASES[i]] = pl;
    }
    return [
      table(
        '曲用',
        numbers,
        CASES.map((c) => [c, numbers.map((n) => n + c)]),
        values,
      ),
    ];
  }

  function verb(e, o, overrides) {
    const [lemma, ...rest] = e.head.split(' '),
      tail = rest.length ? ' ' + rest.join(' ') : '';
    const type = e.class || o.conjugation || '非交替',
      isVowel = type === '母音幹',
      pair = type.match(/^([aeo])\/([eiu])交替$/),
      values = {
        不定形: lemma,
      };
    let strong = stem(o.strongStem),
      weak = stem(o.presentStem);
    if (isVowel) {
      weak =
        weak ||
        {
          jen: 'ji',
          bajen: 'ba',
        }[lemma] ||
        (lemma.endsWith('n') ? lemma.slice(0, -1) : vowel(lemma) ? lemma : '');
      if (!weak || !vowel(weak)) throw Error('母音で終わる現在語幹を入力してください。');
      const a = weak.endsWith('e') ? weak.slice(0, -1) + 'a' : weak;
      Object.assign(values, {
        現在1単数: a + 's',
        現在2単数: weak + 'č',
        現在3単数: weak,
        現在1複数: weak + 'v',
        現在2複数: weak + 'g',
        現在3複数: weak + 'si',
        アオリスト: weak + 't',
        命令単数: weak,
        命令複数: weak + 'g',
        接続法: weak + 's',
        条件法: a + 'n',
        動名詞: weak + 'd',
        過去分詞: join('di', weak + 't'),
      });
    } else {
      strong = strong || (lemma.endsWith('en') ? lemma.slice(0, -2) : '');
      if (!strong) throw Error('強語幹を入力してください。');
      weak = weak || (pair ? change(strong, pair[1], pair[2]) : strong);
      const verbBare = (s) =>
        /[^aeiouäöürlmnwj][rl]$/.test(s) ? s.slice(0, -1) + 'e' + s.slice(-1) : bare(s);
      const thirdPlural = /[dt]$/.test(weak)
        ? weak.slice(0, -1) + 'ži'
        : /[sž]$/.test(weak)
          ? weak + 'i'
          : /[^aeiouäöürlmnwj][rl]$/.test(weak)
            ? weak.slice(0, -1) + 'e' + weak.slice(-1) + 'si'
            : weak + 'si';
      Object.assign(values, {
        現在1単数: join(weak, 'as'),
        現在2単数: join(weak, 'eč'),
        現在3単数: verbBare(weak),
        現在1複数: join(weak, 'ev'),
        現在2複数: join(weak, 'eg'),
        現在3複数: thirdPlural,
        アオリスト: pair ? verbBare(strong) : join(strong, 'it'),
        命令単数: verbBare(strong),
        命令複数: join(strong, 'eg'),
        接続法: join(weak, 'es'),
        条件法: join(strong, 'an'),
        動名詞: join(weak, 'ad'),
        過去分詞: participle(weak),
      });
    }
    if (isVowel) {
      // Lexical irregularities specified in grammar §2.4.8.
      const special = {
        len: {
          アオリスト: 'lit',
          動名詞: 'lad',
          過去分詞: 'dilt',
        },
        zen: {
          アオリスト: 'zit',
          過去分詞: 'dizit',
        },
        jen: {
          現在1単数: 'jas',
          アオリスト: 'je',
          命令単数: 'ja',
          命令複数: 'jag',
          接続法: 'jes',
          条件法: 'jan',
          動名詞: 'jad',
          過去分詞: 'dijet',
        },
      };
      Object.assign(values, special[lemma] || {});
    }
    for (const k of Object.keys(values)) values[k] += tail;
    Object.assign(values, overrides);
    const current = o.impersonal
      ? single('現在', ['現在3単数'], values)
      : table(
          '現在の人称活用',
          ['単数', '複数'],
          [1, 2, 3].map((p) => [p + '人称', ['現在' + p + '単数', '現在' + p + '複数']]),
          values,
        );
    const labels = [
      '不定形',
      'アオリスト',
      ...(!o.impersonal ? ['命令単数', '命令複数'] : []),
      '接続法',
      '条件法',
      ...(!tail ? ['動名詞', '過去分詞'] : []),
    ];
    const tables = [current, single('時制・法・非定形', labels, values)];
    if (o.gerundDeclension && !tail) {
      const gerund = values['動名詞'];
      if (gerund && /^[A-Za-zÄÖÜŠŽČäöüšžč]+$/.test(gerund)) {
        const t = noun(
          {
            head: gerund,
            gender: 'N',
            class: '固定型',
            numberRestriction: '',
          },
          {
            nounPattern: 'consonant',
            obliqueStem: gerund,
          },
        )[0];
        t.title = '動名詞の曲用';
        for (let i = 0; i < t.rows.length; i++)
          for (const f of t.rows[i].cells) {
            if (f.label.startsWith('複数') && i !== 3)
              f.value = join(umlaut(gerund), ['i', 'ins', 'irs', 'us', 'ils'][i]);
            f.label = '動名詞' + f.label;
          }
        tables.push(t);
      }
    }
    return tables;
  }

  function adjective(e, o) {
    const s =
      stem(o.adjectiveStem) ||
      (e.head.endsWith('q') || e.head.endsWith('nk')
        ? e.head.slice(0, -1) + 'g'
        : e.head.endsWith('k')
          ? e.head.slice(0, -1) + 'c'
          : e.head);
    const female = stem(o.femaleStem) || s,
      neuter = stem(o.neuterStem) || umlaut(s),
      values = {};
    values['男性単数主格'] = e.head;
    values['女性単数主格'] = join(female, 'a');
    values['中性単数主格'] = stem(o.neuterForm) || bare(neuter);
    for (let i = 0; i < CASES.length; i++) {
      const c = CASES[i];
      if (i) {
        values['男性単数' + c] = join(i === 2 ? umlaut(s) : s, ['', 'en', 'er', 'u', 'el'][i]);
        values['女性単数' + c] = join(female, ['', 'an', 'ar', 'o', 'al'][i]);
        values['中性単数' + c] = join(neuter, ['', 'en', 'er', 'u', 'el'][i]);
      }
      values['男性複数' + c] = join(i === 2 ? umlaut(s) : s, ['es', 'ens', 'ers', 'us', 'els'][i]);
      values['中性複数' + c] = values['男性複数' + c];
      values['女性複数' + c] = join(female, ['as', 'ans', 'ars', 'os', 'als'][i]);
    }
    const tables = ['単数', '複数'].map((n) =>
      table(
        '性・格の一致（' + n + '）',
        ['男性', '女性', '中性'],
        CASES.map((c) => [c, ['男性', '女性', '中性'].map((g) => g + n + c)]),
        values,
      ),
    );
    if (!e.numeralType) {
      Object.assign(values, {
        比較級: join(s, 'ar'),
        最上級: 'uc' + e.head,
        文語最上級: join(umlaut(s), 'ist'),
        副詞形: join(s, 'u'),
      });
      tables.push(single('比較・派生', ['比較級', '最上級', '文語最上級', '副詞形'], values));
    }
    return tables;
  }

  function pronoun(e, o) {
    if (o.pronounPattern === 'none' || (o.pronounPattern !== 'caq' && e.head !== 'čaq')) return [];
    const values = {},
      cases = ['主格', '属格', '対格', '与格', '奪格', '再帰格'];
    cases.forEach((c, i) => (values['単数' + c] = e.head + ['', 'en', 'et', 'er', 'ü', 'el'][i]));
    return [
      table(
        '曲用',
        ['単数'],
        cases.map((c) => [c, ['単数' + c]]),
        values,
      ),
    ];
  }

  function generate(e, o = {}, overrides = {}) {
    if (!e.head) return [];
    if (!/^-?[A-Za-zÄÖÜŠŽČäöüšžč]+(?: [A-Za-zÄÖÜŠŽČäöüšžč]+)*-?$/.test(e.head))
      throw Error('見出し語を入力してください。');
    if (e.kind === '接辞') return [];
    const tables =
      e.pos === '名詞'
        ? noun(e, o)
        : e.pos === '動詞'
          ? verb(e, o, overrides)
          : e.pos === '形容詞'
            ? adjective(e, o)
            : e.pos === '代名詞'
              ? pronoun(e, o)
              : [];
    for (const t of tables)
      for (const r of t.rows)
        for (const f of r.cells)
          if (Object.hasOwn(overrides, f.label)) f.value = overrides[f.label];
    return tables;
  }

  function infer(e) {
    if (e.inflection) return clone(e.inflection);
    const f = map(e),
      o = {},
      head = e.head,
      first = (v) => (v || '').split(' ')[0],
      cut = (v, ending) => (v && v.endsWith(ending) ? v.slice(0, -ending.length) : '');
    if (e.pos === '名詞') {
      let p = nounPattern(e, {});
      if (e.numberRestriction === 'plural')
        p = head.endsWith('a') ? 'plural-a' : head.endsWith('i') ? 'plural-i' : 'consonant';
      else if (f['単数属格'] === head + 'n' && vowel(head))
        p = head.endsWith('a') ? 'a' : head.endsWith('o') ? 'o' : 'short';
      else if (vowel(head) && f['単数属格']?.endsWith('en')) p = 'glide';
      if (
        head.length > 3 &&
        head.endsWith('aq') &&
        f['単数与格'] === head + 'er' &&
        f['複数主格'] === head + 'es'
      )
        p = 'aq';
      o.nounPattern = p === nounPattern(e, {}) ? 'auto' : p;
      const gen = f[(e.numberRestriction === 'plural' ? '複数' : '単数') + '属格'];
      let s = cut(
        gen,
        p === 'plural-i'
          ? 'ins'
          : p === 'plural-a' || p === 'a'
            ? 'an'
            : p === 'o'
              ? 'on'
              : p === 'short'
                ? head.slice(-1) + 'n'
                : 'en',
      );
      // Preserve lexical stem alternations, while allowing regular stems to follow a renamed lemma.
      let defaultStem;
      try {
        defaultStem = nounStem(
          e,
          {
            nounPattern: p,
          },
          p,
        );
      } catch {}
      if (s && s !== defaultStem) o.obliqueStem = s;
    } else if (e.pos === '動詞') {
      const lemma = head.split(' ')[0],
        p3 = first(f['現在3単数']);
      const type = e.class || (vowel(p3) ? '母音幹' : '非交替');
      o.conjugation = type;
      if (type === '母音幹') {
        const regular = lemma.endsWith('n') ? lemma.slice(0, -1) : lemma;
        if (p3 && p3 !== regular) o.presentStem = p3;
      } else {
        const strong = lemma.endsWith('en') ? lemma.slice(0, -2) : '',
          pair = type.match(/^([aeo])\/([eiu])交替$/);
        let regular;
        try {
          regular = pair ? change(strong, pair[1], pair[2]) : strong;
        } catch {}
        const weak = cut(first(f['現在1単数']), 'as');
        if (weak && weak !== regular) o.presentStem = weak;
      }
      o.impersonal = e.tags.includes('無主語');
      o.gerundDeclension = Object.keys(f).some((l) => l.startsWith('動名詞単数'));
    } else if (e.pos === '形容詞') {
      const s =
        head.endsWith('q') || head.endsWith('nk')
          ? head.slice(0, -1) + 'g'
          : head.endsWith('k')
            ? head.slice(0, -1) + 'c'
            : head;
      const female = cut(f['女性単数属格'], 'an'),
        neuter = cut(f['中性単数属格'], 'en');
      if (female && female !== s) o.femaleStem = female;
      if (neuter && neuter !== umlaut(s)) o.neuterStem = neuter;
      if (f['中性単数主格'] && f['中性単数主格'] !== bare(neuter || umlaut(s)))
        o.neuterForm = f['中性単数主格'];
    }
    if (e.pos === '代名詞' && e.head === 'čaq') o.pronounPattern = 'caq';
    let generated = {};
    try {
      generated = map({
        tables: generate(e, o),
      });
    } catch {}
    const overrides = {};
    for (const [label, value] of Object.entries(f))
      if (Object.hasOwn(generated, label) && generated[label] !== value) overrides[label] = value;
    const omitted = Object.keys(generated).filter((k) => !Object.hasOwn(f, k));
    return {
      version: 1,
      settings: o,
      overrides,
      omitted,
    };
  }

  function update(e, model, oldGenerated = []) {
    const generated = generate(e, model.settings, model.overrides),
      oldKeys = new Set(
        forms({
          tables: oldGenerated,
        }).map((f) => f.label),
      ),
      newKeys = new Set(
        forms({
          tables: generated,
        }).map((f) => f.label),
      );
    const excluded = {
      singular: '複数',
      plural: '単数',
    }[e.numberRestriction];
    const allowed = (f) =>
      !model.omitted.includes(f.label) && (!excluded || !f.label.includes(excluded));
    // Keep original grid layouts and custom tables, updating only generated cells.
    const values = map({
        tables: generated,
      }),
      seen = new Set(),
      tables = [];
    for (const t of e.tables) {
      const rows = [];
      for (const r of t.rows) {
        const cells = r.cells
          .filter((f) => allowed(f) && (newKeys.has(f.label) || !oldKeys.has(f.label)))
          .map((f) => {
            seen.add(f.label);
            return {
              label: f.label,
              value: Object.hasOwn(values, f.label) ? values[f.label] : f.value,
            };
          });
        if (cells.length)
          rows.push({
            ...r,
            cells,
          });
      }
      if (rows.length) {
        if (rows.some((r) => r.cells.length !== t.columns.length))
          tables.push(
            single(
              t.title,
              rows.flatMap((r) => r.cells).map((f) => f.label),
              Object.fromEntries(rows.flatMap((r) => r.cells).map((f) => [f.label, f.value])),
            ),
          );
        else
          tables.push({
            ...t,
            rows,
          });
      }
    }
    for (const t of generated) {
      const remaining = forms({
        tables: [t],
      }).filter((f) => allowed(f) && !seen.has(f.label));
      if (!remaining.length) continue;
      if (
        remaining.length ===
        forms({
          tables: [t],
        }).length
      )
        tables.push(t);
      else
        tables.push(
          single(
            t.title,
            remaining.map((f) => f.label),
            Object.fromEntries(remaining.map((f) => [f.label, f.value])),
          ),
        );
    }
    return {
      tables,
      generated,
    };
  }

  function validate(model) {
    if (
      !model ||
      model.version !== 1 ||
      !model.settings ||
      typeof model.settings !== 'object' ||
      Array.isArray(model.settings) ||
      !model.overrides ||
      typeof model.overrides !== 'object' ||
      Array.isArray(model.overrides) ||
      !Array.isArray(model.omitted)
    )
      throw Error('自動補完の設定が不正です。');
    if (
      Object.keys(model).some((k) => !['version', 'settings', 'overrides', 'omitted'].includes(k))
    )

'use strict';
const $ = (id) => document.getElementById(id);
const T = globalThis.LafcaTaxonomy;
const PAGE_SIZE = 24;
DATA.entries = DATA.entries.map(T.normalize);
let page = 0,
  tag = '';
const Search = globalThis.LafcaSearch;
const { normalize, meaningSenses, formatMeaning, kindMatches } = Search;
const makeIndex = () => Search.createIndex(DATA.entries);
let index = makeIndex(),
  order = index;

function refreshIndex() {
  index = makeIndex();
  order = index;
  $('stat').textContent = DATA.entries.length.toLocaleString() + ' 項目';
  syncFilters();
  render();
}

function node(name, text, cls) {
  const el = document.createElement(name);
  if (text !== undefined) el.textContent = text;
  if (cls) el.className = cls;
  return el;
}

function options(values) {
  return [...new Set(values.filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'ja'))
    .map((value) => {
      const option = node('option', value);
      option.value = value;
      return option;
    });
}
$('pos').append(
  ...DATA.partsOfSpeech.map((value) => {
    const option = node('option', value);
    option.value = value;
    return option;
  }),
);

function syncTagFilter() {
  const entries = DATA.entries.filter(
    (e) => kindMatches(e, $('kind').value) && (!$('pos').value || e.pos === $('pos').value),
  );
  const present = new Set(entries.flatMap(T.all));
  const all = node('option', '指定なし');
  all.value = '';
  const select = $('tag-filter');
  select.replaceChildren(all);
  const used = new Set();
  const groups = [
    {
      name: '文法',
      tags: [...present].filter(
        (t) => !T.senseGroups.some((g) => g.tags.includes(t)) && !Object.hasOwn(T.parents, t),
      ),
    },
    {
      name: '分類全体',
      tags: Object.keys(T.parents),
    },
    ...T.senseGroups,
  ];
  for (const g of groups) {
    const group = node('optgroup');
    group.label = g.name;
    for (const t of g.tags)
      if (present.has(t) && !used.has(t)) {
        used.add(t);
        const o = node('option', t);
        o.value = t;
        group.append(o);
      }
    if (group.children.length) select.append(group);
  }
  if (!present.has(tag)) tag = '';
  select.value = tag;
}

function syncFilters() {
  const kind = $('kind').value;
  const hasPos = !['接辞', '接頭辞', '接尾辞'].includes(kind);
  $('pos-filter').hidden = !hasPos;
  $('pos').disabled = !hasPos;
  for (const option of $('pos').options) {
    option.disabled = Boolean(
      option.value &&
        kind &&
        !DATA.entries.some((e) => kindMatches(e, kind) && e.pos === option.value),
    );
  }
  if (!hasPos || $('pos').selectedOptions[0]?.disabled) $('pos').value = '';
  const pos = $('pos').value;
  const hasNumeral =
    !['接辞', '接頭辞', '接尾辞'].includes(kind) &&
    kind !== '慣用句' &&
    ['', '名詞', '形容詞', '連体詞'].includes(pos);
  $('numeral-filter').hidden = !hasNumeral;
  $('numeral').disabled = !hasNumeral;
  if (!hasNumeral) $('numeral').value = '';
  const noun = pos === '名詞';
  $('gender-filter').hidden = !noun;
  $('gender').disabled = !noun;
  if (!noun) $('gender').value = '';
  const classes = ['名詞', '動詞', '形容詞'].includes(pos)
    ? DATA.entries
        .filter((e) => e.pos === pos && kindMatches(e, kind))
        .map((e) => T.label(e.class))
        .filter(Boolean)
    : [];
  const selected = $('class').value;
  const all = node('option', 'すべて');
  all.value = '';
  $('class').replaceChildren(all, ...options(classes));
  $('class').value = classes.includes(selected) ? selected : '';
  $('class-filter').firstChild.textContent =
    pos === '名詞' ? '交替型 ' : pos === '動詞' ? '活用型 ' : '語幹 ';
  $('class-filter').hidden = !classes.length;
  $('class').disabled = !classes.length;
  syncTagFilter();

$('stat').textContent = DATA.entries.length.toLocaleString() + ' 項目';

function clearHash() {
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

function reset() {
  HTMLFormElement.prototype.reset.call($('search-form'));
  syncFilters();
  order = index;
  tag = '';
  page = 0;
  clearHash();
}

function chooseTag(value, sourcePos = '') {
  const grammatical = [
    '男性',
    '女性',
    '中性',
    '固定型',
    'Ⅰ型',
    'Ⅱ型',
    '個別交替型',
    ...Object.values(T.patterns),
    '単数のみ',
    '複数のみ',
    '人名',
  ].includes(value)
    ? '名詞'
    : ['不規則活用', '無主語', '交替', 'a/e交替', 'e/i交替', 'o/u交替', '非交替'].includes(value)
      ? '動詞'
      : ['中性ウムラウト', '中性同形', '女性語幹短縮', '子音幹'].includes(value)
        ? '形容詞'
        : value === '母音幹'
          ? sourcePos
          : '';
  $('pos').value = DATA.partsOfSpeech.includes(value) ? value : grammatical;
  $('kind').value = ['接辞', '接頭辞', '接尾辞', '慣用句'].includes(value) ? value : '';
  $('numeral').value = ['基数', '序数'].includes(value) ? value : value === '数詞' ? 'all' : '';
  $('gender').value = '';
  $('class').value = '';
  tag = DATA.partsOfSpeech.includes(value) || $('kind').value || $('numeral').value ? '' : value;
  syncFilters();
  page = 0;
  clearHash();
  render();
}

function tagButton(t, pos = '') {
  const b = node('button', t, 'tag' + (t === pos ? ' pos' : ''));
  b.type = 'button';
  b.title = t + 'で絞り込む';
  b.addEventListener('click', () => chooseTag(t, pos));
  return b;
}

function tableView(table) {
  const wrapper = node('div', undefined, 'table-wrap'),
    el = node('table'),
    head = node('thead'),
    hr = node('tr');
  el.setAttribute('aria-label', table.title);
  hr.append(node('th', '区分'));
  table.columns.forEach((c) => {
    const th = node('th', c);
    th.scope = 'col';
    hr.append(th);
  });
  head.append(hr);
  el.append(head);
  const body = node('tbody');
  for (const row of table.rows) {
    const tr = node('tr'),
      th = node('th', row.label);
    th.scope = 'row';
    tr.append(th);
    for (const f of row.cells) {
      const td = node('td');
      td.append(node('span', f.value, 'cell-value'));
      tr.append(td);
    }
    body.append(tr);
  }
  el.append(body);
  wrapper.append(el);
  return wrapper;
}

function meaningView(e) {
  const senses = T.senses(e),
    multi = senses.length > 1;
  const list = node(multi ? 'ol' : 'p', undefined, multi ? 'meaning senses' : 'meaning');
  senses.forEach((s) => {
    const row = multi ? node('li') : list;
    row.append(node('span', s.meaning, 'sense-meaning'));
    if (s.tags.length) {
      const tags = node('span', undefined, 'sense-tags');
      s.tags.forEach((t) => tags.append(tagButton(t)));
      row.append(tags);
    }
    if (multi) list.append(row);
  });
  return list;
}

function entryView(e, open = false) {
  const card = node('article', undefined, 'entry');
  card.id = 'entry-' + e.id;
  const heading = node('div', undefined, 'entry-head');

function renderPager(id, pages) {
  const nav = $(id);
  nav.replaceChildren();
  nav.hidden = pages <= 1;
  if (nav.hidden) return;
  const current = page + 1;
  const numbers = new Set([1, Math.ceil(pages / 2), pages]);
  const start = Math.max(1, Math.min(current - 1, pages - 2));
  for (let n = start; n <= Math.min(pages, start + 2); n++) numbers.add(n);
  if (pages <= 7) for (let n = 1; n <= pages; n++) numbers.add(n);

  function button(text, target, disabled = false) {
    const b = node('button', text);
    b.type = 'button';
    b.dataset.page = target - 1;
    b.disabled = disabled;
    if (typeof text === 'number') {
      b.setAttribute('aria-label', text + 'ページ');
      if (target === current) b.setAttribute('aria-current', 'page');
    }
    nav.append(b);
  }
  button('前へ', current - 1, current === 1);
  let previous = 0;
  for (const n of [...numbers].sort((a, b) => a - b)) {
    if (n - previous === 2) button(previous + 1, previous + 1);
    else if (n - previous > 2) {
      const gap = node('span', '…', 'gap');
      gap.setAttribute('aria-hidden', 'true');
      nav.append(gap);
    }
    button(n, n);
    previous = n;
  }
  button('次へ', current + 1, current === pages);
}

                M.forms({
                  tables: previousGenerated,
                }).some((x) => x.label === f.label)
              ) {
                if (v.trim()) model.overrides[f.label] = v;
                else delete model.overrides[f.label];
              }
            }),
            button('削除', () => {
              omit(f.label);
              flattenTable(t, (x) => x !== f);
              if (!t.rows.length) working.tables.splice(ti, 1);
              drawTables();
            }),
          );
          row.children[1].addEventListener('change', () => autocomplete());
          if (Object.hasOwn(model.overrides, f.label)) {
            const reset = button('自動', () => {
              delete model.overrides[f.label];
              autocomplete();
            });
            reset.setAttribute('aria-label', f.label + 'を自動補完に戻す');
            row.append(reset);
          }
          group.append(row);
        }),
      );
      group.append(
        button('語形を追加', () => {
          flattenTable(t);
          t.rows.push({
            label: '',
            cells: [
              {
                label: '',
                value: '',
              },
            ],
          });
          drawTables();
        }),
      );
      tables.append(group);
    });
  }

  function relationPicker(r) {
    const picker = node('div', undefined, 'relation-picker'),
      input = node('input'),
      popup = node('div', undefined, 'relation-popup');
    const list = node('div', undefined, 'relation-options'),
      status = node('p', '', 'relation-status'),
      id = 'relation-' + randomId();
    input.type = 'text';
    input.required = true;
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.placeholder = '見出し語・意味で検索';
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-label', '関連語');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-controls', id);
    input.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-describedby', id + '-status');
    list.id = id;
    list.setAttribute('role', 'listbox');
    list.setAttribute('aria-label', '関連語の候補');
    status.id = id + '-status';
    status.setAttribute('role', 'status');
    const label = (e) => e.head + '（' + (e.pos || e.kind) + '）';
    const selected = DATA.entries.find((e) => e.id === r.id);
    input.value = selected ? label(selected) : '';
    let matches = [],
      active = -1,
      composing = false;

    function hide() {
      popup.hidden = true;
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
      active = -1;
    }

    function highlight(index) {
      active = index;
      [...list.children].forEach((option, i) =>
        option.setAttribute('aria-selected', String(i === active)),
      );
      const option = list.children[active];
      if (option) {
        input.setAttribute('aria-activedescendant', option.id);
        option.scrollIntoView({
          block: 'nearest',
        });
      }
    }

    function choose(e) {
      r.id = e.id;
      r.head = e.head;
      input.value = label(e);
      input.setCustomValidity('');
      input.focus();
      hide();
    }

    function suggest() {
      if (composing) return;
      const query = normalize((r.id ? r.head : input.value).trim());
      list.replaceChildren();
      active = -1;
      input.removeAttribute('aria-activedescendant');
      if (!query) {
        matches = [];
        status.textContent = '';
        hide();
        return;
      }
      const terms = query.split(/\s+/);
      const found = DATA.entries
        .filter((e) => e.id !== working.id)
        .map((e) => ({
          e,
          head: normalize(e.head),
          text: normalize(e.head + ' ' + formatMeaning(e.meaning)),
        }))
        .filter((x) => terms.every((t) => x.text.includes(t)));
      const rank = (x) =>
        x.head === query ? 0 : x.head.startsWith(query) ? 1 : x.head.includes(query) ? 2 : 3;
      found.sort((a, b) => rank(a) - rank(b));
      matches = found.slice(0, 20).map((x) => x.e);
      matches.forEach((e, i) => {
        const option = button('', () => choose(e), 'relation-option');
        option.tabIndex = -1;
        option.id = id + '-' + i;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', 'false');
        const title = node('span', undefined, 'relation-option-title');
        title.append(node('strong', e.head), node('span', e.pos || e.kind, 'relation-pos'));
        const senses = meaningSenses(e.meaning),
          summary = senses.map((s, i) => (senses.length > 1 ? i + 1 + '. ' + s : s)).join('\n');
        option.append(title, node('span', summary, 'relation-meaning'));
        list.append(option);
      });
      status.textContent =
        found.length > 20
          ? found.length + ' 件中20件を表示。続けて入力すると絞り込めます。'
          : found.length
            ? found.length + ' 件'
            : '候補がありません。';
      popup.hidden = false;
      input.setAttribute('aria-expanded', 'true');
    }
    input.addEventListener('input', () => {
      r.id = '';
      r.head = '';
      input.setCustomValidity('候補から関連語を選んでください。');
      if (!composing) suggest();
    });
    input.addEventListener('focus', suggest);
    input.addEventListener('compositionstart', () => {
      composing = true;
      hide();
    });
    input.addEventListener('compositionend', () => {
      composing = false;
      suggest();
    });
    input.addEventListener('keydown', (event) => {
      if (composing || event.isComposing || event.keyCode === 229) return;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (popup.hidden) suggest();
        if (matches.length)
          highlight(
            active < 0
              ? event.key === 'ArrowDown'
                ? 0
                : matches.length - 1
              : Math.max(
                  0,
                  Math.min(matches.length - 1, active + (event.key === 'ArrowDown' ? 1 : -1)),
                ),
          );
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (!popup.hidden && matches.length) choose(matches[Math.max(0, active)]);
      } else if (event.key === 'Escape' && !popup.hidden) {
        event.preventDefault();
        event.stopPropagation();
        hide();
      }
    });
    // Keep keyboard focus on the combobox while clicking a candidate.
    list.addEventListener('mousedown', (event) => event.preventDefault());
    picker.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!picker.contains(document.activeElement)) hide();
      }, 0);
    });
    popup.append(list, status);
    picker.append(input, popup);
    hide();
    return picker;
  }

  function appendRelation(r) {
    const row = node('div', undefined, 'relation-edit-row');
    const type = node('select');
    type.setAttribute('aria-label', '関係');
    const choices = [...E.RELATION_TYPES];
    if (!choices.includes(r.title)) choices.push(r.title);
    for (const value of choices) {
      const option = node('option', value);
      option.value = value;
      type.append(option);
    }
    type.value = r.title;
    type.addEventListener('change', () => {
      r.title = type.value;
    });
    row.append(
      type,
      relationPicker(r),
      button('削除', () => {
        working.relations.splice(working.relations.indexOf(r), 1);
        row.remove();
      }),
    );
    relations.append(row);
    return row;
  }

  function drawRelations() {
    relations.replaceChildren();
    working.relations.forEach(appendRelation);
  }

  function openEditor(id, duplicate = false) {
    if (!ownerToken) return;
    const existing = DATA.entries.find((e) => e.id === id);
    working = existing
      ? E.clone(existing)
      : {
          id: randomId(),
          head: '',
          pos: '名詞',
          kind: '単語',
          numeralType: '',
          numberRestriction: '',
          gender: 'M',
          class: '固定型',
          meaning: '',
          tags: [],
          protoForms: [],
          relations: [],
          tables: [],
        };
    model =
      existing && !duplicate
        ? M.infer(working)
        : {
            version: 1,
            settings: {
              nounPattern: 'auto',
              gerundDeclension: working.pos === '動詞',
            },
            overrides: {},
            omitted: [],
          };
    try {
      previousGenerated = M.generate(working, model.settings, model.overrides);
    } catch {
      previousGenerated = [];
    }
    if (duplicate) {
      working.id = randomId();
      working.head = '';
      working.relations = [];
      working.tables = [];
      delete working.inflection;
      previousGenerated = [];
    }
    openingChange = E.clone(draft.changes.find((c) => E.changeId(c) === working.id) || null);
    remove.hidden = !existing || duplicate;
    head.value = working.head;
    kind.value =
      working.kind === '接辞' ? (working.head.endsWith('-') ? '接頭辞' : '接尾辞') : working.kind;
    pos.value = working.pos;
    gender.value = working.gender;
    number.value = working.numberRestriction;
    numeral.value = working.numeralType;
    editingSenses = T.senses(working);
    if (!editingSenses.length)
      editingSenses = [
        {
          meaning: '',
          tags: [],
        },
      ];
    drawSenses();
    proto.value = working.protoForms.join('\n');
    personName.value = working.tags.includes('人名') ? 'yes' : '';
    irregular.value = working.tags.some((t) => ['不規則', '不規則活用'].includes(t)) ? 'yes' : '';
    syncEditor();
    cls.value = working.class;
    writeSettings();
    syncEditor();
    autocomplete(false);
    errors.textContent = automaticError;
    drawTables();
    drawRelations();
    $('entry-editor-title').textContent = existing && !duplicate ? '語彙を編集' : '語彙を追加';
    editor.showModal();
    head.focus();
    initialForm = formSnapshot();
  }

  function randomId() {
    return [...crypto.getRandomValues(new Uint8Array(8))]
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function formSnapshot() {
    return JSON.stringify([
      working,
      model,
      editingSenses,
      [...form.querySelectorAll('input,textarea,select')].map((i) => i.value),
    ]);
  }

  function closeEditor() {
    if (formSnapshot() !== initialForm && !confirm('入力中の変更を破棄しますか？')) return;
    editor.close();
  }
  editor.addEventListener('cancel', (e) => {
    e.preventDefault();
    closeEditor();
  });

  function readDraft() {
    const text = localStorage.getItem(KEY);
    return text
      ? E.validateDraft(JSON.parse(text))
      : {
          version: 1,
          changes: [],
        };
  }

  function persist(next) {
    requireOwner();
    next = E.materializeDraft(published, next);
    localStorage.setItem(KEY, JSON.stringify(next));
    draft = next;
    refresh();
  }

  function refresh() {
    DATA.entries = ownerToken ? E.applyDraft(published, draft) : E.clone(published);
    refreshIndex();
    notice.textContent = draft.changes.length
      ? draft.changes.length + ' 件の未公開の変更（この端末に保存済み）'
      : '';
    manage.disabled = !draft.changes.length;
    backup.disabled = !draft.changes.length;
  }

  function fail(error) {
    if (!ownerToken) return;
    notice.textContent = error.message;
    render();
  }

  function deleteEntry() {
    try {
      requireOwner();
      const target = DATA.entries.find((e) => e.id === working.id);
      if (!target) throw new Error('この語は既に削除されています。');
      if (!confirm('「' + target.head + '」を削除しますか？ この語への関連リンクも削除します。'))
        return;
      const latest = readDraft(),
        current = latest.changes.find((c) => E.changeId(c) === working.id) || null;
      if (!E.equal(current, openingChange))
        throw new Error('別のタブでこの語を編集しています。開き直してください。');
      persist(E.deleteDraft(published, latest, working.id));
      editor.close();
      reset();
      render();
      if (draft.changes.length) showChanges();
    } catch (error) {
      errors.textContent = error.message;
    }
  }
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    errors.textContent = '';
    try {
      requireOwner();
      if (entryKind() === '接辞' && head.value.trim()) {
        head.value =
          kind.value === '接頭辞'
            ? head.value.replace(/^-|-$/g, '') + '-'
            : '-' + head.value.replace(/^-|-$/g, '');
      }
      autocomplete(false);
      if (automaticError) throw new Error(automaticError);
      const e = {
        ...working,
        head: head.value.trim().normalize('NFC'),
        kind: entryKind(),
        pos: pos.value,
        gender: gender.disabled ? '' : gender.value,
        class: cls.disabled ? '' : cls.value,
        numberRestriction: number.disabled ? '' : number.value,
        numeralType: numeral.disabled ? '' : numeral.value,
        meaning: readSenses()
          .map((s) => s.meaning)
          .join('\n'),
        senseTags: readSenses().filter((s) => s.tags.length),
        protoForms: proto.value
          .split('\n')
          .map((s) => s.trim())
          .filter(Boolean)
          .map((s) => (s.startsWith('*') ? s : '*' + s)),
      };
      const extraValues = [
        e.pos === '名詞' && personName.value ? '人名' : '',
        e.pos === '動詞' && irregular.value ? '不規則活用' : '',
        e.pos === '動詞' && model.settings.impersonal ? '無主語' : '',
      ].filter(Boolean);
      if (['名詞', '動詞', '形容詞', '代名詞'].includes(e.pos)) e.inflection = E.clone(model);
      else delete e.inflection;
      e.tags = E.tags(e, extraValues);
      E.validate(e);
      E.apply(DATA.entries, [e]);
      const latest = readDraft(),
        current = latest.changes.find((c) => E.changeId(c) === e.id) || null;
      if (!E.equal(current, openingChange))
        throw new Error('別のタブでこの語を編集しています。入力を控え、開き直してください。');
      persist(E.updateDraft(published, latest, e));
      editor.close();
      showEntry(e.id);
      if (event.submitter !== saveDraft) showChanges();
    } catch (error) {
      errors.textContent =
        error.name === 'QuotaExceededError'
          ? '端末に保存する空き容量がありません。入力内容を控えてください。'
          : error.message;
    }
  });
  const changesDialog = dialog('changes-dialog', '未公開の変更を公開'),
    changesList = node('div'),
    publishStatus = node('p', '', 'edit-status');
  publishStatus.setAttribute('role', 'status');
  publishStatus.id = 'publish-status';
  const publish = button('公開する', publishDraft, 'primary');
  publish.id = 'publish-edits';
  const close = button('閉じる', () => changesDialog.close());
  changesDialog.append(changesList, publishStatus, publish, close);
  let publishing = false;
  changesDialog.addEventListener('cancel', (e) => {
    if (publishing) e.preventDefault();
  });

  function showChanges() {
    if (!ownerToken) return;
    changesList.replaceChildren();
    publishStatus.replaceChildren();
    for (const c of draft.changes) {
      const row = node('div', undefined, 'change-row'),
        entry = c.after || c.before;
      row.append(
        node('span', entry.head + '（' + (!c.after ? '削除' : c.before ? '編集' : '追加') + '）'),
      );
      if (c.after)
        row.append(
          button('編集', () => {
            changesDialog.close();
            openEditor(entry.id);
          }),
        );
      row.append(
        button('変更を取り消す', () => {
          if (!confirm(entry.head + ' の未公開の変更を取り消しますか？')) return;
          try {
            persist(E.revertDraft(published, readDraft(), entry.id));
            showChanges();
          } catch (e) {
            publishStatus.textContent = e.message;
          }
        }),
      );
      changesList.append(row);
    }
    publish.disabled = !draft.changes.length;
    if (!changesDialog.open) changesDialog.showModal();
  }
  async function publishDraft() {
    if (!ownerToken) return;
    const changes = E.clone(draft.changes);
    publishing = true;
    [...changesDialog.querySelectorAll('button')].forEach((b) => (b.disabled = true));
    try {
      const result = await LafcaGitHub.publish(
        changes,
        ownerToken,
        (m) => (publishStatus.textContent = m),
      );
      if (!ownerToken) return;
      // Retain any edits made in other tabs while the request was in flight.
      const latest = readDraft();
      latest.changes = latest.changes.filter((c) => !changes.some((sent) => E.equal(sent, c)));
      published = E.clone(result.entries);
      persist(latest);
      publishStatus.replaceChildren(
        node('span', 'GitHubに保存しました。公開ページへの反映には少し時間がかかります。 '),
      );
      const a = node('a', '保存した変更');
      a.href = result.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      publishStatus.append(a);
      changesList.replaceChildren();
    } catch (error) {
      if (error.code === 'AUTH') {
        logout();
        showLogin(error.message);
      } else publishStatus.textContent = error.message;
    } finally {
      publishing = false;
      [...changesDialog.querySelectorAll('button')].forEach((b) => (b.disabled = false));
      publish.disabled = !draft.changes.length;
    }
  }

  function download(name, text, type) {
    const url = URL.createObjectURL(
        new Blob([text], {
          type,
        }),
      ),
      a = node('a');
    a.href = url;
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  importInput.addEventListener('change', async () => {
    try {
      requireOwner();
      const file = importInput.files[0];
      if (!file) return;
      if (file.size > 10_000_000) throw new Error('ファイルが大きすぎます。');
      const imported = E.validateDraft(JSON.parse(await file.text())),
        latest = readDraft();
      for (const c of imported.changes) {
        const old = latest.changes.find((x) => E.changeId(x) === E.changeId(c));
        if (old && !E.equal(old, c))
          throw new Error('この端末の変更と重複しています：' + (c.after || c.before).head);
        if (!old) latest.changes.push(c);
      }
      E.applyDraft(published, latest);
      persist(latest);
    } catch (e) {
      fail(e);
    } finally {
      importInput.value = '';
    }
  });
  window.addEventListener('storage', (event) => {
    if (ownerToken && event.key === KEY) {
      try {
        draft = readDraft();
        refresh();
      } catch (e) {
        fail(e);
      }
    }
  });
  window.lafcaEditControls = (e) => {
    const controls = node('div', undefined, 'entry-edit-controls');
    if (ownerToken && editing)
      controls.append(
        button('編集', () => openEditor(e.id)),
        button('複製して追加', () => openEditor(e.id, true)),
      );
    return controls;
  };
  refresh();
})();
</script>
</body>
</html>
